# ==============================================================================
# Dotfiles Configurations Layer
# ==============================================================================
configs:
  # Directories
  - name: ".zsh"
    dest: "~/.zsh"
    encrypted: true

  - name: "hypr/dms"
    dest: "~/.config/hypr/dms"
    os: ["linux"]

  - name: "yazi"
    dest: "~/.config/yazi"
    include:
      - "**/*.{toml,yaml,yml,xml,json,lua}"

  - name: "Brainstorming"
    dest: "~/Brainstorming"
    encrypted: true

  - name: "fastfetch"
    dest: "~/.config/fastfetch"

  - name: "fish"
    dest: "~/.config/fish"
    exclude:
      - "completions/"
      - "conf.d/"
      - "fish_variables"

  - name: "oh-my-posh"
    dest: "~/.config/oh-my-posh"

  - name: "fresh/config.json"
    dest: "~/.config/fresh/config.json"

  - name: "ghostty-config-linux"
    dest: "~/.config/ghostty/config"
    os: ["linux"]

  - name: "ghostty-config-mac"
    dest: "~/.config/ghostty/config"
    os: ["mac"]

  - name: "scripts"
    dest: "~/scripts"

  - name: "micro/colorschemes"
    dest: "~/.config/micro/colorschemes"

  - name: "micro/syntax"
    dest: "~/.config/micro/syntax"

  - name: "micro/plug"
    dest: "~/.config/micro/plug"
    overwrite: false
    include:
      - "**/*.{yaml,yml,lua,json}"
      - "**/help/"
      - "**/snippets/snippets/"

  # Files
  - name: ".zshrc"
    dest: "~/.zshrc"

  - name: ".zshenv"
    dest: "~/.zshenv"
    encrypted: true

  - name: ".zsh_history"
    dest: "~/.zsh_history"
    encrypted: true

  - name: ".wakatime.cfg"
    dest: "~/.wakatime.cfg"
    encrypted: true

  - name: "fish_history"
    dest: "~/.local/share/fish/fish_history"
    encrypted: true

  - name: "install_release/config.json"
    dest: "~/.config/install_release/config.json"

  - name: "satty/config.toml"
    dest: "~/.config/satty/config.toml"

  # Hyprland
  - name: "hypr/hyprland.lua"
    dest: "~/.config/hypr/hyprland.lua"
    os: ["linux"]

  - name: "hypr/bindings.lua"
    dest: "~/.config/hypr/bindings.lua"
    os: ["linux"]

  - name: "hypr/monitors.lua"
    dest: "~/.config/hypr/monitors.lua"
    os: ["linux"]

  # DMS
  - name: "DankMaterialShell/clsettings.json"
    dest: "~/.config/DankMaterialShell/clsettings.json"

  - name: "DankMaterialShell/plugin_settings.json"
    dest: "~/.config/DankMaterialShell/plugin_settings.json"

  - name: "DankMaterialShell/plugins.lock.json"
    dest: "~/.config/DankMaterialShell/plugins.lock.json"

  - name: "DankMaterialShell/settings.json"
    dest: "~/.config/DankMaterialShell/settings.json"

  # Electron shenanigans
  - name: "brave-flags.conf"
    dest: "~/.config/brave-flags.conf"
    os: ["linux"]

  - name: "chrome-flags.conf"
    dest: "~/.config/chrome-flags.conf"
    os: ["linux"]

  - name: "chromium-flags.conf"
    dest: "~/.config/chromium-flags.conf"
    os: ["linux"]

  - name: "code-flags.conf"
    dest: "~/.config/code-flags.conf"
    os: ["linux"]

  - name: "rvfet-assets"
    dest: "~/Pictures/Assets"

  - name: "lsd-config.yaml"
    dest: "~/.config/lsd/config.yaml"

  - name: "lite-xl-user_settings.lua"
    dest: "~/.config/lite-xl/user_settings.lua"

  - name: "fastfetch-config.jsonc"
    dest: "~/.config/fastfetch/config.jsonc"

  - name: "alacritty.toml"
    dest: "~/.config/alacritty/alacritty.toml"

  - name: "starship.toml"
    dest: "~/.config/starship.toml"

  - name: "alacritty-default-theme.json"
    dest: "~/.config/tilix/schemes/alacritty-default-theme.json"

  - name: ".tmux.conf"
    dest: "~/.tmux.conf"

  - name: "micro/settings.json"
    dest: "~/.config/micro/settings.json"

  - name: "micro/bindings.json"
    dest: "~/.config/micro/bindings.json"

  # vscodium
  - name: "vscodium-linux.yml"
    dest: "~/.config/VSCodium/User/globalStorage/zokugun.sync-settings/settings.yml"
    os: ["linux"]

  - name: "vscodium-mac.yml"
    dest: "~/Library/Application Support/VSCodium/User/globalStorage/zokugun.sync-settings/settings.yml"
    os: ["mac"]

  # SUDO required
  - name: "etc/keyd/default.conf"
    dest: "/etc/keyd/default.conf"
    os: ["linux"]

  - name: "etc/dnscrypt-proxy/dnscrypt-proxy.toml"
    dest: "/etc/dnscrypt-proxy/dnscrypt-proxy.toml"
    os: ["linux"]
    encrypted: true

  - name: "etc/systemd/resolved.conf.d/dns.conf"
    dest: "/etc/systemd/resolved.conf.d/dns.conf"
    os: ["linux"]
    encrypted: true

  - name: "etc/NetworkManager/conf.d/dns.conf"
    dest: "/etc/NetworkManager/conf.d/dns.conf"
    os: ["linux"]
    encrypted: true
